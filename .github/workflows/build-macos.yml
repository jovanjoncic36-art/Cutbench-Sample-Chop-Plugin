name: Build macOS plugins

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          build() {
            rm -rf build
            cmake -B build -G Xcode "$@" && cmake --build build --config Release
          }
          if build -DCUTBENCH_STRETCH=ON -DCUTBENCH_ACCELERATE=ON; then
            echo "stretch engine: ON (Accelerate FFT)" > build-info.txt
          elif build -DCUTBENCH_STRETCH=ON -DCUTBENCH_ACCELERATE=OFF; then
            echo "::warning::Built the stretch engine without Apple Accelerate."
            echo "stretch engine: ON (plain FFT)" > build-info.txt
          else
            echo "::warning::The time-stretch library failed to build. Building without it (Classic engine only)."
            build -DCUTBENCH_STRETCH=OFF
            echo "stretch engine: OFF (Classic only)" > build-info.txt
          fi
          cat build-info.txt

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/Cutbench_artefacts/Release/AU/Cutbench.component dist/
          cp -R build/Cutbench_artefacts/Release/VST3/Cutbench.vst3 dist/
          cp build-info.txt dist/BUILD-INFO.txt
          cd dist && zip -qry ../Cutbench-macOS.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: Cutbench-macOS
          path: Cutbench-macOS.zip
