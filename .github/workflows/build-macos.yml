name: Build macOS plugins

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (with time-stretch engine)
        id: full
        continue-on-error: true
        run: |
          cmake -B build -G Xcode -DCUTBENCH_STRETCH=ON
          cmake --build build --config Release

      - name: Fallback build (without time-stretch engine)
        if: steps.full.outcome == 'failure'
        run: |
          echo "::warning::The time-stretch library failed to build. Building without it (Classic engine only)."
          rm -rf build
          cmake -B build -G Xcode -DCUTBENCH_STRETCH=OFF
          cmake --build build --config Release

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/Cutbench_artefacts/Release/AU/Cutbench.component dist/
          cp -R build/Cutbench_artefacts/Release/VST3/Cutbench.vst3 dist/
          cd dist && zip -qry ../Cutbench-macOS.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: Cutbench-macOS
          path: Cutbench-macOS.zip
